new_research:

  - id: "darkforest"
    type: "Paper"
    title: "DarkForest: Less Talk, Higher Accuracy for Multi-Agent LLMs"
    authors: ["Li", "Wei", "Jiang", "et al."]
    year: 2026
    month: "May"
    arxiv: "2605.25188"
    url: "https://arxiv.org/abs/2605.25188"
    license: "arXiv open access"
    truth_status: "VERIFIED"
    layer_mapping: "Layer 4.5 Consensus Gateway"
    relevance: |
      Controlled-communication coordination using calibrated belief distributions.
      Each agent generates independently; outputs are parsed into structured candidate
      records and semantically clustered; a calibrated evidence score
      s(z) = R_pi * sum(alpha_i * rho_i * delta_i * phi(c_i))
      weights by reliability, parse quality, confidence, and independence correction.
      A deterministic guardrail prevents coordinator from discarding strongly-supported
      candidates. Beats strongest baseline by up to 30.7%, cuts tokens 6.5x.
    direct_application:
      vote_aggregation: |
        Replace raw majority vote in Layer 4.5 with DarkForest calibrated belief.
        Each voter submits sealed answer + confidence; coordinator sees only belief
        summary, not raw reasoning. Guardrail prevents overriding strongly-supported
        consensus with coordinator hallucination.
      diversity_policy: |
        Independence correction delta_i already implements diversity policy:
        correlated agents (fine-tuned from same base) get down-weighted.
        Provides mathematical basis for mixing model families in the gateway.
      offline_calibration: |
        Requires a calibration dataset of known-answer questions for each model.
        Collect from FLOSSI0ULLK's existing benchmark runs. Refresh on model update.
    open_risks:
      - "Calibration dataset must not overlap benchmark; sampling bias risk"
      - "Canonicalization step is task-specific; requires custom parsers per domain"
      - "Guardrail threshold sensitivity: ~2/3 posterior threshold performs best"

  - id: "swarmsys"
    type: "Paper"
    title: "SwarmSys: Decentralized Swarm-Inspired Agents for Scalable Reasoning"
    authors: ["Li", "Liu", "Zhao", "et al."]
    year: 2025
    month: "October"
    arxiv: "2510.10047"
    url: "https://arxiv.org/abs/2510.10047"
    license: "arXiv open access"
    truth_status: "VERIFIED"
    layer_mapping: "Layer 4 RSA Swarm + Validator split"
    relevance: |
      Closed-loop distributed multi-agent reasoning with three specialized roles:
      Explorers (generate diverse hypotheses), Workers (refine/exploit), Validators
      (verify and gate). Coordination via pheromone-inspired reinforcement:
      successful paths accumulate 'pheromone' weight; agents probabilistically
      follow high-pheromone paths. No central supervisor. Embedding-based
      probabilistic task matching enables self-organizing convergence.
      Outperforms baselines on symbolic reasoning, research synthesis, scientific
      programming.
    direct_application:
      rsv_mapping: |
        Explorer = RSA Scout layer. Worker = RSA Analyst/Synthesizer.
        Validator = existing Byzantine fault-tolerant validator split.
        Pheromone weights map to DarkForest reliability alpha_i values:
        agents whose outputs are frequently validated accumulate reliability.
      holochain_integration: |
        Pheromone state can be stored on Holochain source chains per agent.
        Each validation event is a signed entry. Reputation is the running
        pheromone integral — agent-local, cryptographically attributable.
        This directly addresses DeepSeek critique: karma gaming becomes
        impossible without breaking source chain integrity.
      failure_modes_to_mitigate:
        - name: "Premature convergence"
          mechanism: "All agents follow strongest pheromone trail before solution space explored"
          mitigation: "Inject explorer agents with forced novelty constraint (DarkForest independence correction delta)"
        - name: "Mode collapse"
          mechanism: "Pheromone evaporation too slow — outdated solutions persist"
          mitigation: "Time-decay pheromone function; trigger re-exploration on validation failure rate spike"
        - name: "Adversarial pheromone injection"
          mechanism: "Malicious agent casts many validations to boost bad path"
          mitigation: "Membrane proofs (Holochain) gate validator admission; MARGIN per-agent calibration detects systematic miscalibration"

  - id: "margin"
    type: "Paper"
    title: "MARGIN: Runtime Confidence Calibration for Multi-Agent Foundation Model Coordination"
    authors: ["Armstrong, Joss"]
    year: 2026
    month: "May"
    arxiv: "2605.22949"
    url: "https://arxiv.org/abs/2605.22949"
    license: "arXiv open access"
    truth_status: "VERIFIED"
    relevance: |
      Online per-agent calibration using symmetric EWMA with Bayesian shrinkage.
      No model access, no held-out data, no retraining. Across 18 models, 8 benchmarks,
      44,000+ observations: 3-6x lower calibration error than best design-time baseline
      under distribution shift. Raw self-reported confidence fails to beat random at
      pairwise resolution (43-50% on hard benchmarks). MARGIN raises this to 70-89%.
    direct_application: |
      Drop-in runtime calibration layer for DarkForest alpha_i weights.
      Solves the distribution shift problem (DeepSeek: "design-time calibration degrades
      under distribution shift"). No retraining required — compatible with local GGUF models.

  - id: "delayed_verification"
    type: "Paper"
    title: "Delayed Verification Destabilizes Multi-Agent LLM Belief"
    authors: ["Itkin, I."]
    year: 2026
    month: "June"
    arxiv: "2606.27409"
    url: "https://arxiv.org/abs/2606.27409"
    license: "arXiv open access"
    truth_status: "VERIFIED"
    relevance: |
      Formal spectral analysis of verification delay in multi-agent graphs.
      Key finding: most unstable regime is when communication delay and verification
      delay coincide. For delay=2, instability threshold is the inverse golden ratio (~0.618).
      Correction too strong OR too delayed can turn consensus into oscillation.
      Greedy (1-1/e)-approximation rule for optimal corrector placement given limited budget.
    direct_application: |
      Validator placement in SwarmSys/Layer 4 should follow greedy supermodular rule.
      Do NOT chain validators with same delay as communication lag.
      Grounded factual verification (truth as absorbing boundary) eliminates the oscillation
      — confirms Holochain source-chain-anchored ground truth approach.

  - id: "aggregated_confidence"
    type: "Paper"
    title: "Multiagent Protocols with Aggregated Confidence Signals"
    authors: ["Elahi, Ali", "Di Eugenio, Barbara"]
    year: 2026
    month: "June"
    arxiv: "2606.13591"
    url: "https://arxiv.org/abs/2606.13591"
    license: "arXiv open access"
    truth_status: "VERIFIED"
    relevance: |
      Three protocols (WSV, CGA, HID) that produce a single aggregated system-level
      confidence alongside the answer, via Bayesian fusion of per-agent calibrated
      confidence signals. Aggregated confidence is substantially more discriminative
      (AUARC) than best single agent or debate baseline. Restores F1 losses that
      standard multi-agent debate incurs on ambiguous tasks.
    direct_application: |
      Use CGA+Bayesian fusion as the output confidence signal from the consensus gateway.
      This gives downstream human supervisors a calibrated uncertainty estimate,
      enabling escalation decisions without reviewing raw agent traces.

  - id: "argent_asp"
    type: "Paper"
    title: "Trustworthy Multi-Agent Systems: Mitigating Semantic Drift with the Argent Signaling Protocol"
    authors: ["Sharma, Anantha"]
    year: 2026
    month: "May"
    arxiv: "2606.19356"
    url: "https://arxiv.org/abs/2606.19356"
    license: "CC BY 4.0"
    truth_status: "VERIFIED"
    relevance: |
      Compact machine-readable header (@C certainty, @G grounding, @S stochasticity,
      + assumption index) accompanying every agent response. Enables controller to
      distinguish repairable failures from containment failures. ASP sidecar in
      multi-agent mode blocks 100% of ungrounded upstream outputs (24/27 blocked,
      0 ungrounded propagations). Jensen-Shannon divergence monitoring for bounded
      distributional drift. Orthogonal Latent Message Bus (OLMB) architecture
      specified for learned orthogonal latent channels.
    direct_application: |
      ASP header = lightweight implementation of FLOSSI0ULLK provenance packet.
      Add @C/@G/@S to every inter-agent message in the consensus gateway.
      JSD monitoring provides the 'containment vs repair' routing that the
      FLOSSIOULLK system needs for graceful degradation.

  - id: "sagallm"
    type: "Paper"
    title: "SagaLLM: Context Management, Validation, and Transaction Guarantees for Multi-Agent LLM Planning"
    authors: ["Chang, Edward Y.", "Geng, Longling"]
    year: 2025
    month: "March"
    arxiv: "2503.11951"
    url: "https://arxiv.org/abs/2503.11951"
    github: "https://github.com/genglongling/SagaLLM"
    license: "Open source"
    truth_status: "VERIFIED"
    relevance: |
      Integrates Saga transactional pattern (database distributed transactions) into
      multi-agent LLM planning: persistent memory, automated compensation on failure,
      independent validation agents, modular checkpointing. Each operation either
      fully succeeds or triggers compensating rollback — no partial-failure states.
      Cited 61 times; published at VLDB 2025.
    direct_application: |
      SagaLLM checkpoints are the transactional substrate for this artifact's
      context continuation protocol. Each research session is a Saga transaction:
      checkpoints on major findings, compensation (flag conflicting evidence) on
      contradiction, rollback metadata preserved for audit.

  - id: "soos_dam"
    type: "IETF Draft"
    title: "The Data Artifact Management (DAM) Protocol for Agentic AI Systems"
    authors: ["Sato, Tom"]
    year: 2026
    month: "June"
    ietf_id: "draft-sato-soos-dam-00"
    url: "https://datatracker.ietf.org/doc/draft-sato-soos-dam/"
    last_updated: "2026-06-30"
    license: "IETF open"
    truth_status: "VERIFIED"
    relevance: |
      Typed taxonomy of data artifacts in agentic AI systems. Governance envelope
      per artifact type specifying provenance, access policy, temporal validity,
      and retention. Normative interface between agent-generated artifacts and the
      Governance Audit Record (GAR). Part of SOOS protocol family (SOV, MAD, CAP).
    direct_application: |
      DAM provides the formal schema for FLOSSIOULLK artifact governance envelopes.
      This CCA artifact should carry a DAM-compatible governance envelope.
      Companion: draft-sato-soos-sov-02 (Sovereign Object) and draft-sato-soos-mad-03
