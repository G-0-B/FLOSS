name: Rust CI

# ---------------------------------------------------------------------------
# History: this file was `rust-ci.yml` until 593f9e1 (2025-11-15) renamed it to
# `rust-ci.md` to put it "on hold for further actual project impl". GitHub only
# loads `.yml`/`.yaml` from this directory, so the rename silently disabled the
# whole workflow -- and left a file that reads as documentation sitting in a
# workflows directory. Nine months later nobody could tell whether Rust CI was
# broken or deliberately off.
#
# The hold is preserved, but made explicit and selective instead of invisible:
#
#   * `fmt`  -- runs automatically on Rust changes. Cheap, and verified green
#               against ARF/ on main @ c1f51ac (`cargo fmt --all -- --check`, exit 0).
#   * `clippy`, `test`, `clippy-sarif` -- STILL HELD. They run only via manual
#               `workflow_dispatch`. Lift the hold by deleting the `if:` guard
#               on each job once the Holochain build is expected to pass in CI.
#
# The old version also ran cargo from the repository root, which has no
# Cargo.toml -- it would have failed immediately even if the trigger had worked.
# Every cargo step now runs in ARF/, the actual workspace root.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/rust-ci.yml"
  merge_group:
    types: [checks_requested]
  schedule:
    # Once a month at 05:00 UTC on the 1st.
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ARF/Cargo.toml is the workspace root. The repository root has no manifest.
  CARGO_WORKSPACE: ARF

jobs:
  fmt:
    name: Format (cargo fmt --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt (check only)
        working-directory: ${{ env.CARGO_WORKSPACE }}
        run: cargo fmt --all -- --check

  clippy:
    name: Lint (cargo clippy) [HELD -- manual only]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ARF/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ARF/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo clippy (deny warnings)
        working-directory: ${{ env.CARGO_WORKSPACE }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (all features) [HELD -- manual only]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: clippy
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ARF/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ARF/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (all features)
        working-directory: ${{ env.CARGO_WORKSPACE }}
        run: cargo test --all-features

  clippy-sarif:
    name: Clippy SARIF (advisory) [HELD -- manual only]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: clippy

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ARF/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ARF/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install SARIF tools
        run: cargo install clippy-sarif sarif-fmt

      - name: Run clippy and produce SARIF
        working-directory: ${{ env.CARGO_WORKSPACE }}
        continue-on-error: true
        run: |
          cargo clippy --all-features --message-format=json \
            | clippy-sarif \
            | tee rust-clippy-results.sarif \
            | sarif-fmt

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.CARGO_WORKSPACE }}/rust-clippy-results.sarif
          wait-for-processing: true
