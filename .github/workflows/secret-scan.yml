name: Secret Scan

# ---------------------------------------------------------------------------
# Why this exists
#
# On 2026-09-06 a workspace audit found ten key-shaped values sitting in an
# untracked file that nothing in .gitignore covered, in a repository that was
# about to gain a remote. Committed history was clean, so nothing had leaked --
# but the only thing standing between the keys and a public push was one person
# remembering to look. This workflow is that person, automated.
#
# Two jobs, mirroring the green-set/advisory split in python-ci.yml:
#
#   * `pr-diff`       -- REQUIRED. Scans only what a PR adds. Fast, blocks merge.
#   * `full-history`  -- advisory. Scans every commit on every push to main and
#                        weekly. Never blocks, because a finding in old history
#                        needs rotation and a rewrite, not a red PR.
#
# Findings are always redacted. A CI log is a public artifact; printing a secret
# to prove a secret leaked would leak it again, to a wider audience, forever.
# The log names the file, the line and the rule. The value stays out of it.
#
# Allowlisting lives in .gitleaks.toml, never here. Read the rule at the top of
# that file before adding to it.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
  # Deliberately NOT path-filtered, for the reason documented at length in
  # python-ci.yml: GitHub leaves a required check PENDING rather than passing
  # when path filtering skips its workflow, so a filter here would hang every
  # PR that happens to touch no matching file. A secret can arrive in any file
  # type anyway -- a .md with a pasted token is the common case -- so there is
  # no filter that would be correct even if the mechanics allowed one.
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly full-history sweep. Rules improve over time; a commit that was
    # clean under last year's ruleset is not clean forever.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned deliberately. An unpinned scanner is a supply-chain dependency that
  # can change what it reports -- in either direction -- without a diff here.
  GITLEAKS_VERSION: "8.28.0"

jobs:
  pr-diff:
    name: Secret scan (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff scan below needs both endpoints of the
          # comparison, and a shallow clone has neither reliably.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # push to main, merge_group, or manual dispatch
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # `github.event.before` is all-zeroes on a branch's first push, and
          # empty for dispatch. Fall back to scanning the single head commit
          # rather than silently scanning nothing -- an empty range is the
          # failure mode where this check passes without looking at anything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${head}~1"
            git rev-parse --verify "$base" >/dev/null 2>&1 || base="$head"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Scanning $base..$head"

      - name: Scan the diff
        run: |
          set -euo pipefail
          base='${{ steps.range.outputs.base }}'
          head='${{ steps.range.outputs.head }}'
          if [ "$base" = "$head" ]; then
            log_opts="--log-opts=-1 ${head}"
          else
            log_opts="--log-opts=${base}..${head}"
          fi
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-pr.sarif \
            "$log_opts"

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "### Secret scan failed"
            echo ""
            echo "gitleaks found a candidate secret in the commits this PR adds."
            echo "Values are redacted above and in the uploaded SARIF on purpose."
            echo ""
            echo "If it is a real secret:"
            echo "1. **Rotate it first.** It is in a pushed commit; treat it as compromised"
            echo "   whether or not this repository is public."
            echo "2. Remove it from the branch history, not just from the tip."
            echo "3. Add whatever should have caught it to \`.gitignore\`."
            echo ""
            echo "If it is not a secret, add an allowlist entry to \`.gitleaks.toml\`"
            echo "with a reason explaining why the string cannot be a credential."
            echo "\"It was noisy\" is not a reason."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-pr-sarif
          path: gitleaks-pr.sarif
          if-no-files-found: ignore
          retention-days: 14

  full-history:
    name: Full history (advisory, never blocks)
    # Skipped on PRs: the diff job already covers what a PR adds, and a finding
    # in history predating the PR is not that PR's to fix.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan all history
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks-full.sarif

      - name: Summarize
        if: always()
        run: |
          count=0
          if [ -f gitleaks-full.sarif ]; then
            count=$(python3 -c "import json,sys; d=json.load(open('gitleaks-full.sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo 0)
          fi
          {
            echo "### Full-history secret scan (advisory)"
            echo ""
            echo "Findings: **${count}**"
            echo ""
            if [ "${count}" != "0" ]; then
              echo "A finding here means a secret is in committed history. Rotating it is"
              echo "the fix; removing the commit is cleanup. Do them in that order."
              echo ""
              echo "Redacted details are in the \`gitleaks-full-sarif\` artifact."
            else
              echo "No candidate secrets in any commit reachable from this ref."
            fi
            echo ""
            echo "This job never blocks a merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-sarif
          path: gitleaks-full.sarif
          if-no-files-found: ignore
          retention-days: 30
