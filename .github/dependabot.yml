# Dependabot version updates.
#
# Security ALERTS were already on for this repository (23 open on `main` as of
# 2026-08-20: 9 high, 11 moderate, 3 low) but nothing was configured to actually
# propose fixes, so the alerts just accumulated.
#
# Deliberately conservative so this does not become its own noise source:
#   * monthly, not daily or weekly
#   * everything grouped per ecosystem, so one PR per ecosystem per cycle
#   * low open-PR limits
#   * `archive/` and `ARF/in.finite-nrg/` manifests are NOT registered -- they
#     are superseded or pre-migration trees, and updating them means nothing.
#
# Security updates are not rate-limited by these settings; they open regardless.

version: 2
updates:
  # --- GitHub Actions used by the workflows in this directory ---------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # --- Python --------------------------------------------------------------
  # ONE entry covering every requirements location, not one per directory.
  #
  # Two entries (`/` and `/ARF`) produced two PRs that both edited
  # ARF/requirements.txt -- #51 and #49 -- so they were guaranteed to conflict,
  # and whichever merged second would need a manual rebase for no reason. The
  # root entry already reaches ARF/requirements.txt on its own; `directories`
  # adds the pwnies file that only the /ARF entry was picking up.
  #
  # The point of one entry is that ONE config owns all three paths, so no two
  # entries can propose conflicting edits to the same file again. How Dependabot
  # then shapes the PRs across `directories` -- a single grouped PR, or one per
  # directory -- I have not verified, and the honest note is that it does not
  # matter here: either shape is conflict-free, because there is no second entry
  # to conflict with.
  #
  # Review suggested adding `group-by: dependency-name`. Declined: by its own
  # description that produces one PR PER DEPENDENCY, which is further from the
  # single-PR-per-cycle intent than the current setting, not closer.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/ARF"
      - "/ARF/pwnies"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # --- JavaScript ----------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      root-npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The Cloudflare commons-gateway worker -- live and serving, so keep it
  # patched, but grouped so it is one review per cycle.
  - package-ecosystem: npm
    directory: "/workers/commons-gateway"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      commons-gateway:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # --- Rust ----------------------------------------------------------------
  # ARF/Cargo.toml is the workspace root. The hdi/hdk pins there are EXACT
  # (`=0.7.1` / `=0.6.1`) and deliberate -- see the comment block in that file
  # and docs/agent-memory/project/holochain-version-line-skew.md.
  #
  # An earlier version of this comment claimed Dependabot would not move an
  # exact pin. That was wrong, and it was the load-bearing assumption behind
  # registering this ecosystem at all. Dependabot treats `=0.7.1` as a target
  # to update, not as a constraint to respect, and it edits the manifest as
  # well as the lockfile. The Holochain line skew is exactly the thing those
  # pins exist to hold still, so the exclusion is explicit below rather than
  # assumed. This entry is for the transitive tree, not the Holochain line.
  - package-ecosystem: cargo
    directory: "/ARF"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      arf-cargo:
        patterns: ["*"]
    ignore:
      # Held by ADR-tracked version-line decisions, not by the pin syntax.
      - dependency-name: "hdi"
      - dependency-name: "hdk"
      - dependency-name: "holochain_serialized_bytes"
      # getrandom is NOT an ordinary dependency of the zomes. Each zome declares
      # `getrandom = { version = "0.3", features = ["wasm_js"] }` purely to turn
      # on the wasm backend of the getrandom that hdi/hdk already pull in. It is
      # a feature-enabling shim, and it only works while it resolves to the SAME
      # version hdi requires.
      #
      # PR #46 bumped it to 0.4 on its own. hdi 0.7.1 still needs 0.3.4, so the
      # two now coexisted as separate crates, `wasm_js` applied only to 0.4.3,
      # and 0.3.4 was left with no wasm backend:
      #
      #     error[E0425]: cannot find function `inner_u32` in module `backends`
      #       --> getrandom-0.3.4/src/lib.rs
      #
      # Verified by `cargo check --workspace --target wasm32-unknown-unknown`:
      # clean on origin/main, broken on that PR. Native `cargo check` passes on
      # both, which is why it looks harmless.
      #
      # Scoped to the MAJOR jump, not the whole crate. A blanket
      # `dependency-name: getrandom` would also suppress security updates, and
      # 0.3.x patch releases are exactly what should still flow: they unify with
      # what hdi already requires, so they carry no risk of the split above.
      # Only 0.4+ does.
      - dependency-name: "getrandom"
        versions: [">=0.4"]
    commit-message:
      prefix: "chore(deps)"
