[pytest]
# These four modules fail at COLLECTION time on a clean checkout, which aborts
# the entire run before any test executes. They are ignored here so the rest of
# the suite is runnable at all. Each needs a real fix, not a permanent ignore.
#
#   ARF/in.finite-nrg/infinity-bridge/tests/test_protocol.py
#       collection error -- firmware-adjacent tree, imports a module that is not
#       on the path in a plain checkout.
#   ARF/metacoordinator/test_consensus.py
#       superseded by packages/orchestrator; the ARF-side copy no longer imports.
#   ARF/pwnies/tests/test_performance.py
#       imports ARF.desktop_pony_swarm, which does not exist under that name.
#   ARF/tests/test_committee_validation.py
#       imports MockValidatorBackend from validation.agent_pool, which no longer
#       exports it.
#
# Collection errors here also poison sys.modules for later collection, which is
# why packages/orchestrator/test_*.py fail in a full run but pass in isolation.
addopts =
    --ignore=ARF/in.finite-nrg/infinity-bridge/tests/test_protocol.py
    --ignore=ARF/metacoordinator/test_consensus.py
    --ignore=ARF/pwnies/tests/test_performance.py
    --ignore=ARF/tests/test_committee_validation.py
